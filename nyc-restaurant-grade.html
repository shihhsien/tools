<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="NYC Grade">
<title>NYC Grade</title>
<style>
  :root { --bg:#0b0b0c; --card:#161617; --line:#2a2a2c; --text:#f4f4f5; --muted:#9b9ba1; --A:#16a34a; --B:#ca8a04; --C:#dc2626; --gray:#52525b; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { overflow-x: hidden; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 16px; padding-bottom: 60px; max-width: 600px; }
  a { color: #60a5fa; }
  h1 { font-size: 20px; margin: 4px 0 2px; }
  .sub { font-size: 12px; color: var(--muted); margin-bottom: 16px; line-height: 1.5; }
  .row { display: flex; gap: 8px; }
  .row + .row { margin-top: 8px; }
  input { flex: 1; width: 100%; padding: 14px; font-size: 16px; background: var(--card); border: 1px solid var(--line); border-radius: 12px; color: var(--text); }
  input::placeholder { color: var(--muted); }
  #maps-input { background: #1a1a2e; border-color: #3a3a5c; }
  .divider { display: flex; align-items: center; gap: 10px; margin: 12px 0 4px; }
  .divider span { font-size: 11px; color: var(--gray); text-transform: uppercase; letter-spacing: .06em; white-space: nowrap; }
  .divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: var(--line); }
  button { width: 100%; margin-top: 10px; padding: 15px 18px; font-size: 17px; font-weight: 600; border: none; border-radius: 12px; background: #fff; color: #000; }
  button:active { opacity: .7; }
  .status { font-size: 13px; color: var(--muted); margin: 14px 2px; }
  .status.err { color: #f87171; }
  .muted { color: var(--muted); }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px; margin-top: 12px; }
  .top { display: flex; gap: 12px; align-items: center; }
  .grade { flex: 0 0 auto; width: 48px; height: 48px; line-height: 48px; text-align: center; border-radius: 10px; font-weight: 700; font-size: 26px; color: #fff; }
  .grade.A{background:var(--A)} .grade.B{background:var(--B)} .grade.C{background:var(--C)} .grade.other{background:var(--gray);font-size:15px}
  .name { font-weight: 600; font-size: 16px; }
  .addr { font-size: 13px; color: var(--muted); margin-top: 2px; }
  .detail { font-size: 13px; margin-top: 10px; line-height: 1.45; }
  .detail b { font-weight: 600; }
  .viol { font-size: 12px; color: var(--muted); margin-top: 6px; }
  .pending { color: var(--B); }
  .ver { position: fixed; bottom: 0; left: 0; right: 0; padding: 10px 16px; font-size: 11px; color: var(--gray); background: var(--bg); border-top: 1px solid var(--line); }
</style>
</head>
<body>
<h1>NYC Restaurant Grade</h1>
<div class="sub">Official NYC Health Dept data (DOHMH). Name + optional location (street, borough, or ZIP — not neighborhood).</div>

<div class="row"><input id="q" placeholder="Restaurant name" autocapitalize="characters" autocomplete="off"></div>
<div class="row"><input id="loc" placeholder="Street, borough, or ZIP (optional)" autocapitalize="words" autocomplete="off"></div>
<div class="divider"><span>or paste a link</span></div>
<div class="row">
  <input id="maps-input" placeholder="Paste a Google Maps link…" autocomplete="off" autocorrect="off" autocapitalize="none">
</div>

<button id="go">Look up grade</button>
<div id="status" class="status"></div>
<div id="results"></div>
<div class="ver">v1.12.4</div>

<script>
// ---- Config & DOM -----------------------------------------------------
const API = 'https://data.cityofnewyork.us/resource/43nn-pn8j.json';
const PROXY = 'https://corsproxy.io/?url=';
const MAPS_HOSTS = /google\.com\/maps|maps\.app\.goo\.gl|goo\.gl\/maps/i;

const nameInput = document.getElementById('q');
const locInput  = document.getElementById('loc');
const mapsInput = document.getElementById('maps-input');
const statusEl  = document.getElementById('status');
const resultsEl = document.getElementById('results');
const btn       = document.getElementById('go');

// ---- Small helpers ----------------------------------------------------
const decode = s => { try { return decodeURIComponent(s); } catch { return s; } };
const setStatus = text => { statusEl.className = 'status'; statusEl.textContent = text; };
const setError  = html => { statusEl.className = 'status err'; statusEl.innerHTML = html; };
const gradeClass = g => (['A', 'B', 'C'].includes(g) ? g : 'other');

function fmtDate(d) {
  if (!d) return '—';
  try { return new Date(d).toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric' }); }
  catch { return d; }
}

// ---- NYC DOHMH API ----------------------------------------------------
function buildUrl(name, loc) {
  let where = `upper(dba) like '%${name}%'`;
  if (loc) {
    const L = loc.toUpperCase();
    where += ` and (upper(street) like '%${L}%' or upper(boro) like '%${L}%' or zipcode='${loc}')`;
  }
  const params = new URLSearchParams({
    $select: 'camis,dba,building,street,boro,zipcode,grade,score,grade_date,inspection_date,inspection_type,violation_description,critical_flag,action',
    $where: where,
    $order: 'inspection_date DESC',
    $limit: '200',
  });
  return `${API}?${params}`;
}

// Fetch JSON directly, falling back to a CORS proxy if the call is blocked.
async function getJSON(url) {
  try {
    const res = await fetch(url);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    return res.json();
  } catch {
    const res = await fetch(PROXY + encodeURIComponent(url));
    if (!res.ok) throw new Error('HTTP ' + res.status + ' (proxy)');
    return res.json();
  }
}

// ---- Rendering --------------------------------------------------------
// One restaurant has many inspection rows. Collapse them by camis, keeping
// the latest inspection and the most recent letter grade separately.
function groupByRestaurant(rows) {
  const byId = {};
  for (const row of rows) {
    const g = byId[row.camis] || (byId[row.camis] = { info: row, latest: row, graded: null });
    if (row.inspection_date > g.latest.inspection_date) g.latest = row;
    if (row.grade && (!g.graded || row.grade_date > g.graded.grade_date)) g.graded = row;
  }
  return Object.values(byId);
}

function cardHtml({ info, graded, latest }) {
  const grade = graded ? graded.grade : null;
  const addr = `${info.building || ''} ${info.street || ''}, ${info.boro || ''} ${info.zipcode || ''}`
    .replace(/\s+/g, ' ').trim();
  const gradeLine = graded
    ? `Grade <b>${graded.grade}</b> · score ${graded.score ?? '—'} · graded ${fmtDate(graded.grade_date)}`
    : `<span class="pending">No letter grade on record yet</span> (latest score ${latest.score ?? '—'})`;
  const viol = latest.violation_description
    ? `<div class="viol">Latest cited (${latest.critical_flag || ''}): ${latest.violation_description}</div>`
    : '';
  return `
    <div class="card">
      <div class="top">
        <div class="grade ${gradeClass(grade)}">${grade || '?'}</div>
        <div><div class="name">${info.dba || 'Unknown'}</div><div class="addr">${addr}</div></div>
      </div>
      <div class="detail">${gradeLine}</div>
      <div class="detail muted">Last inspection: ${fmtDate(latest.inspection_date)} · ${latest.inspection_type || ''}</div>
      ${viol}
    </div>`;
}

function render(rows, name) {
  const groups = groupByRestaurant(rows);
  if (!groups.length) {
    setStatus(`No active record for "${name}". Try a shorter name, drop the location, or check spelling.`);
    return;
  }
  setStatus(`${groups.length} match(es) · official data`);
  resultsEl.innerHTML = groups.map(cardHtml).join('');
}

// ---- Search -----------------------------------------------------------
async function search() {
  const normalize = s => s.replace(/[‘’′]/g, "'");
  const name = normalize(nameInput.value.trim()).toUpperCase().replace(/'/g, "''");
  const loc  = normalize(locInput.value.trim()).replace(/'/g, "''");
  if (!name) return setStatus('Enter a restaurant name.');

  btn.disabled = true;
  resultsEl.innerHTML = '';
  setStatus('Looking up official data…');
  try {
    render(await getJSON(buildUrl(name, loc)), name);
  } catch (e) {
    setError(`Couldn't load (${e.message}). Open raw data directly: <a href="${buildUrl(name, loc)}" target="_blank">view JSON</a>`);
  } finally {
    btn.disabled = false;
  }
}

// ---- Google Maps link → restaurant name -------------------------------
// Pull a place name out of a Maps URL (or any text containing one). No network.
function nameFromUrl(url) {
  if (!url) return '';
  // Reject coordinates, URL strings, and query-param-looking values.
  const isName = s => s.length > 1 && /[a-zA-Z]/.test(s) && !/[?=&]/.test(s) && !/^https?:\/\//i.test(s);
  const place = url.match(/\/maps\/place\/([^/@?&"'\s]+)/);
  if (place) {
    const name = decode(place[1].replace(/\+/g, ' ')).trim();
    return isName(name) ? name : '';
  }
  try {
    const q = (new URL(url).searchParams.get('q') || '').trim();
    return isName(q) ? q : '';
  } catch { return ''; }
}

// Strip the trailing " - Google Maps" from a page title; reject empty/Google-only/URL strings.
function cleanTitle(raw) {
  const name = (raw || '').replace(/\s*[-·|]\s*(Google\s+)?Maps\s*$/i, '').trim();
  return name.length > 1 && !/^google/i.test(name) && !/[?=&]/.test(name) && !/^https?:\/\//i.test(name) ? name : '';
}

// Guess the NYC borough from an address string (used to prefill location).
function boroFromAddr(addr) {
  const s = (addr || '').toUpperCase();
  if (/BROOKLYN|KINGS/.test(s)) return 'BROOKLYN';
  if (/MANHATTAN|NEW YORK, NY/.test(s)) return 'MANHATTAN';
  if (/QUEENS/.test(s)) return 'QUEENS';
  if (/BRONX/.test(s)) return 'BRONX';
  if (/STATEN ISLAND|RICHMOND/.test(s)) return 'STATEN ISLAND';
  return '';
}

// Resolvers may return "Name, 123 St, Brooklyn, NY" — keep the name, mine the boro.
function splitPlace(name, boro) {
  if (!name.includes(',')) return { name, boro };
  const [first, ...rest] = name.split(',');
  return { name: first.trim(), boro: boro || boroFromAddr(rest.join(',')) };
}

function timeoutFetch(url, opts, ms = 6000) {
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), ms);
  return fetch(url, { ...opts, signal: ctrl.signal }).finally(() => clearTimeout(timer));
}

// Three best-effort resolvers for short links. All follow Google's redirect
// server-side; Google blocks datacenter IPs inconsistently, so they're
// raced with a timeout and treated as a bonus, not a guarantee.
async function viaMapu(url) {
  // mapu.retiolus.net is purpose-built for maps.app.goo.gl; uses a real
  // browser UA to get past Google's bot detection. Returns { full_link }.
  const res = await timeoutFetch('https://mapu.retiolus.net/unshortener?link=' + encodeURIComponent(url));
  if (!res.ok) throw 0;
  const data = await res.json();
  const name = nameFromUrl(data.full_link) || cleanTitle(data.full_link);
  if (!name) throw 0;
  return { name, boro: boroFromAddr(data.full_link) };
}

async function viaMicrolink(url) {
  const res = await timeoutFetch('https://api.microlink.io/?url=' + encodeURIComponent(url));
  const data = res.ok ? (await res.json()).data : null;
  const name = data && (nameFromUrl(data.url) || cleanTitle(data.title));
  if (!name) throw 0;
  return { name, boro: boroFromAddr(data.url) };
}

async function viaJina(url) {
  const res = await timeoutFetch('https://r.jina.ai/' + url, { headers: { 'X-Return-Format': 'text' } });
  if (!res.ok) throw 0;
  const text = await res.text();
  const source = (text.match(/URL Source:\s*(\S+)/i) || [])[1] || '';
  const title  = (text.match(/^Title:\s*(.+)$/im) || [])[1] || '';
  const name = nameFromUrl(source) || cleanTitle(title) || nameFromUrl(text);
  if (!name) throw 0;
  return { name, boro: boroFromAddr(text) };
}

async function resolveMapsLink(url) {
  // Full Maps URLs carry the name in the path/query — instant, no network.
  const direct = nameFromUrl(url);
  if (direct) return splitPlace(direct, '');

  // Short links (maps.app.goo.gl) need a proxy to follow Google's redirect.
  try {
    const place = await Promise.any([viaMapu(url), viaMicrolink(url), viaJina(url)]);
    return splitPlace(place.name, place.boro);
  } catch {
    throw new Error('app-link');
  }
}

// ---- Wiring -----------------------------------------------------------
async function onMapsLink() {
  const url = mapsInput.value.trim();
  if (!url.startsWith('http') || !MAPS_HOSTS.test(url)) return;

  btn.disabled = true;
  for (let attempt = 1; attempt <= 2; attempt++) {
    setStatus(attempt === 1 ? 'Resolving Maps link…' : 'Retrying…');
    try {
      const { name, boro } = await resolveMapsLink(url);
      nameInput.value = name;
      if (boro) locInput.value = boro;
      mapsInput.value = '';
      await search();
      return;
    } catch (e) {
      if (attempt < 2) continue;
      btn.disabled = false;
      if (e.message !== 'app-link') return setError('Could not resolve link.');
      const safeUrl = url.replace(/"/g, '&quot;');
      setError(`Short Maps links can't be expanded here (Google blocks it). <a href="${safeUrl}" target="_blank" rel="noopener">Open it ↗</a>, let the map load, then copy the full URL from the address bar and paste it back — or just type the name above.`);
    }
  }
}

btn.addEventListener('click', search);
[nameInput, locInput].forEach(el => el.addEventListener('keydown', e => { if (e.key === 'Enter') search(); }));
mapsInput.addEventListener('input', onMapsLink);

// Deep link: ?q=Name (&loc=Borough) auto-fills and searches on load, so the
// tool can be opened pre-filled from a bookmark or an iOS Shortcut.
const qs = new URLSearchParams(location.search);
if (qs.get('q')) {
  nameInput.value = qs.get('q');
  if (qs.get('loc')) locInput.value = qs.get('loc');
  search();
}
</script>
</body>
</html>

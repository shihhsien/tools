<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="NYC Grade">
<title>NYC Grade</title>
<style>
  :root { --bg:#0b0b0c; --card:#161617; --line:#2a2a2c; --text:#f4f4f5; --muted:#9b9ba1; --A:#16a34a; --B:#ca8a04; --C:#dc2626; --gray:#52525b; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { overflow-x: hidden; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 16px; padding-bottom: 60px; max-width: 600px; }
  h1 { font-size: 20px; margin: 4px 0 2px; }
  .sub { font-size: 12px; color: var(--muted); margin-bottom: 16px; line-height: 1.5; }
  .row { display: flex; gap: 8px; }
  input { flex: 1; padding: 14px; font-size: 16px; background: var(--card); border: 1px solid var(--line); border-radius: 12px; color: var(--text); width: 100%; }
  input::placeholder { color: var(--muted); }
  #maps-input { background: #1a1a2e; border-color: #3a3a5c; }
  .divider { display: flex; align-items: center; gap: 10px; margin: 12px 0 4px; }
  .divider span { font-size: 11px; color: var(--gray); text-transform: uppercase; letter-spacing: .06em; white-space: nowrap; }
  .divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: var(--line); }
  button { padding: 15px 18px; font-size: 17px; font-weight: 600; border: none; border-radius: 12px; background: #fff; color: #000; width: 100%; margin-top: 10px; }
  button:active { opacity: .7; }
  .status { font-size: 13px; color: var(--muted); margin: 14px 2px; }
  .status.err { color: #f87171; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px; margin-top: 12px; }
  .top { display: flex; gap: 12px; align-items: center; }
  .grade { flex: 0 0 auto; width: 48px; height: 48px; line-height: 48px; text-align: center; border-radius: 10px; font-weight: 700; font-size: 26px; color: #fff; }
  .grade.A{background:var(--A)} .grade.B{background:var(--B)} .grade.C{background:var(--C)} .grade.other{background:var(--gray);font-size:15px}
  .name { font-weight: 600; font-size: 16px; }
  .addr { font-size: 13px; color: var(--muted); margin-top: 2px; }
  .detail { font-size: 13px; margin-top: 10px; line-height: 1.45; }
  .detail b { font-weight: 600; }
  .viol { font-size: 12px; color: var(--muted); margin-top: 6px; }
  .pending { color: var(--B); }
</style>
</head>
<body>
<h1>NYC Restaurant Grade</h1>
<div class="sub">Official NYC Health Dept data (DOHMH). Name + optional location (street, borough, or ZIP — not neighborhood).</div>
<div class="row">
  <input id="q" placeholder="Restaurant name" autocapitalize="characters" autocomplete="off">
</div>
<div class="row" style="margin-top:8px">
  <input id="loc" placeholder="Street, borough, or ZIP (optional)" autocapitalize="words" autocomplete="off">
</div>
<div class="divider"><span>or paste a link</span></div>
<div class="row">
  <input id="maps-input" placeholder="Google Maps link…" autocomplete="off" autocorrect="off" autocapitalize="none">
</div>
<button id="go">Look up grade</button>
<div id="status" class="status"></div>
<div id="results"></div>
<div style="position:fixed;bottom:0;left:0;right:0;padding:10px 16px;font-size:11px;color:var(--gray);background:var(--bg);border-top:1px solid var(--line)">v1.5.0</div>

<script>
const API = "https://data.cityofnewyork.us/resource/43nn-pn8j.json";
const PROXY = "https://corsproxy.io/?url=";
const statusEl = document.getElementById('status');
const resultsEl = document.getElementById('results');
const btn = document.getElementById('go');

function fmtDate(d){ if(!d) return '—'; try{ return new Date(d).toLocaleDateString('en-US',{year:'numeric',month:'short',day:'numeric'});}catch{return d;} }
function gradeClass(g){ return ['A','B','C'].includes(g)?g:'other'; }

function buildUrl(name, loc){
  let where = `upper(dba) like '%${name}%'`;
  if (loc){
    const L = loc.toUpperCase();
    where += ` and (upper(street) like '%${L}%' or upper(boro) like '%${L}%' or zipcode='${loc}')`;
  }
  const params = new URLSearchParams();
  params.set('$select','camis,dba,building,street,boro,zipcode,grade,score,grade_date,inspection_date,inspection_type,violation_description,critical_flag,action');
  params.set('$where', where);
  params.set('$order','inspection_date DESC');
  params.set('$limit','200');
  return `${API}?${params.toString()}`;
}

async function getJSON(url){
  try {
    const r = await fetch(url);
    if (!r.ok) throw new Error('HTTP '+r.status);
    return await r.json();
  } catch(e) {
    const r2 = await fetch(PROXY + encodeURIComponent(url));
    if (!r2.ok) throw new Error('HTTP '+r2.status+' (proxy)');
    return await r2.json();
  }
}

function render(rows, name){
  if(!rows.length){ statusEl.className='status'; statusEl.textContent=`No active record for "${name}". Try a shorter name, drop the location, or check spelling.`; return; }
  const g = {};
  for(const r of rows){
    const id=r.camis;
    if(!g[id]) g[id]={info:r,graded:null,latest:null};
    const e=g[id];
    if(!e.latest || r.inspection_date>e.latest.inspection_date) e.latest=r;
    if(r.grade && (!e.graded || r.grade_date>e.graded.grade_date)) e.graded=r;
  }
  statusEl.className='status';
  statusEl.textContent=`${Object.keys(g).length} match(es) · official data`;
  resultsEl.innerHTML='';
  for(const id in g){
    const {info,graded,latest}=g[id];
    const grade=graded?graded.grade:null;
    const addr=`${info.building||''} ${info.street||''}, ${info.boro||''} ${info.zipcode||''}`.replace(/\s+/g,' ').trim();
    const c=document.createElement('div'); c.className='card';
    let gradeLine;
    if(graded){ gradeLine=`Grade <b>${graded.grade}</b> · score ${graded.score??'—'} · graded ${fmtDate(graded.grade_date)}`; }
    else { gradeLine=`<span class="pending">No letter grade on record yet</span> (latest score ${latest.score??'—'})`; }
    const violLine = latest.violation_description ? `<div class="viol">Latest cited (${latest.critical_flag||''}): ${latest.violation_description}</div>` : '';
    c.innerHTML=`
      <div class="top">
        <div class="grade ${gradeClass(grade)}">${grade||'?'}</div>
        <div><div class="name">${info.dba||'Unknown'}</div><div class="addr">${addr}</div></div>
      </div>
      <div class="detail">${gradeLine}</div>
      <div class="detail" style="color:var(--muted)">Last inspection: ${fmtDate(latest.inspection_date)} · ${latest.inspection_type||''}</div>
      ${violLine}`;
    resultsEl.appendChild(c);
  }
}

async function search(){
  const name=document.getElementById('q').value.trim().toUpperCase().replace(/'/g,'');
  const loc=document.getElementById('loc').value.trim().replace(/'/g,'');
  if(!name){ statusEl.className='status'; statusEl.textContent='Enter a restaurant name.'; return; }
  btn.disabled=true; resultsEl.innerHTML=''; statusEl.className='status'; statusEl.textContent='Looking up official data…';
  try{
    const rows=await getJSON(buildUrl(name,loc));
    render(rows,name);
  }catch(e){
    statusEl.className='status err';
    statusEl.innerHTML=`Couldn't load (${e.message}). Open raw data directly: <a style="color:#60a5fa" href="${buildUrl(name,loc)}" target="_blank">view JSON</a>`;
  }finally{ btn.disabled=false; }
}

btn.addEventListener('click',search);
document.getElementById('q').addEventListener('keydown',e=>{if(e.key==='Enter')search();});
document.getElementById('loc').addEventListener('keydown',e=>{if(e.key==='Enter')search();});

function extractFromUrl(url) {
  if (!url) return null;
  const m = url.match(/\/maps\/place\/([^/@?&]+)/);
  if (m) { const n = decodeURIComponent(m[1].replace(/\+/g,' ')).trim(); if (n) return { name: n }; }
  try { const q = new URL(url).searchParams.get('q'); if (q && q.length > 1) return { name: q.trim() }; } catch(e) {}
  return null;
}

// Best-effort: pull NYC borough from an address string
function boroFromAddr(addr) {
  const s = (addr||'').toUpperCase();
  if (/BROOKLYN|KINGS/.test(s)) return 'BROOKLYN';
  if (/MANHATTAN|NEW YORK, NY/.test(s)) return 'MANHATTAN';
  if (/QUEENS/.test(s)) return 'QUEENS';
  if (/BRONX/.test(s)) return 'BRONX';
  if (/STATEN ISLAND|RICHMOND/.test(s)) return 'STATEN ISLAND';
  return '';
}

async function resolveMapsLink(url) {
  const direct = extractFromUrl(url);
  if (direct) return direct;

  let html = '', finalUrl = '';

  // Try allorigins.win — returns status.url (the final URL after all redirects)
  try {
    const res = await fetch('https://api.allorigins.win/get?url=' + encodeURIComponent(url));
    if (res.ok) { const d = await res.json(); finalUrl = d?.status?.url || ''; html = d?.contents || ''; }
  } catch(e) {}

  const fromFinal = extractFromUrl(finalUrl);
  if (fromFinal) return { ...fromFinal, boro: boroFromAddr(html) };

  // Fallback: corsproxy.io
  if (!html) {
    try {
      const res = await fetch(PROXY + encodeURIComponent(url));
      if (res.ok) html = await res.text();
    } catch(e) {}
  }

  if (html) {
    // /maps/place/NAME — handle escaped slashes in JS strings (\/, %2F, plain /)
    const m = html.match(/maps(?:\\\/|\/|%2F)place(?:\\\/|\/|%2F)([^\\\/\?@"&<\s\n\r]{2,80})/i);
    if (m) return { name: decodeURIComponent(m[1].replace(/\+/g,' ')).trim(), boro: boroFromAddr(html) };

    // Firebase Dynamic Link: continueUrl / ifl JS variable
    const cu = html.match(/["'](?:continueUrl|ifl|url)['"]\s*[=:]\s*["']([^"']*maps[^"']*)["']/i);
    if (cu) { const r = extractFromUrl(cu[1]); if (r) return { ...r, boro: boroFromAddr(html) }; }

    // Any full google.com/maps URL in HTML (escaped or plain)
    const mu = html.match(/https?:\\?\/\\?\/(?:www\.)?google\.com\\?\/maps[^\s"'<>\n\r]{5,}/i);
    if (mu) { const r = extractFromUrl(mu[0].replace(/\\\//g,'/')); if (r) return { ...r, boro: boroFromAddr(html) }; }

    // Title tag
    const title = ((html.match(/<title[^>]*>([^<]+)/i)||[])[1]||'')
      .replace(/\s*[-·|]\s*(Google\s+)?Maps\s*$/i,'').trim();
    if (title && !/^google/i.test(title)) return { name: title, boro: boroFromAddr(html) };
  }

  throw new Error('Could not extract name — enter it manually');
}

const mapsInput = document.getElementById('maps-input');
mapsInput.addEventListener('input', async function() {
  const url = this.value.trim();
  if (!url.startsWith('http') || !/google\.com\/maps|maps\.app\.goo\.gl|goo\.gl\/maps/i.test(url)) return;
  statusEl.className='status'; statusEl.textContent='Resolving Maps link…';
  btn.disabled=true;
  try {
    const result = await resolveMapsLink(url);
    document.getElementById('q').value = result.name || result;
    if (result.boro) document.getElementById('loc').value = result.boro;
    this.value = '';
    await search();
  } catch(e) {
    statusEl.className='status err';
    statusEl.textContent='Could not resolve link: ' + e.message;
    btn.disabled=false;
  }
});
</script>
</body>
</html>

<!-- @dsCard group="Components" viewport="700x560" name="Core components" subtitle="GradeBadge, Button, Input, Divider, StatusLine, Card, ResultCard" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../../styles.css">
<style>
  body { margin: 0; background: var(--surface-page); font-family: var(--font-sans); color: var(--text-primary); padding: 22px; }
  .sec { margin-bottom: 22px; }
  .lbl { font-size: 11px; font-family: var(--font-mono); color: var(--text-tertiary); text-transform: uppercase; letter-spacing: .06em; margin-bottom: 10px; }
  .rowflex { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
  .col { max-width: 560px; }
  .stack { display: flex; flex-direction: column; gap: 8px; }
  a { color: var(--text-link); text-decoration: none; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script type="text/babel">
  const { GradeBadge, Button, Input, Divider, StatusLine, Card, ResultCard } =
    window.NYCRestaurantGradeDesignSystem_09ad2a;

  function Demo() {
    return (
      <div className="col">
        <div className="sec">
          <div className="lbl">GradeBadge — solid</div>
          <div className="rowflex">
            <GradeBadge grade="A" />
            <GradeBadge grade="B" />
            <GradeBadge grade="C" />
            <GradeBadge grade="N/A" />
            <GradeBadge grade="?" />
          </div>
        </div>

        <div className="sec">
          <div className="lbl">GradeBadge — soft</div>
          <div className="rowflex">
            <GradeBadge grade="A" soft />
            <GradeBadge grade="B" soft />
            <GradeBadge grade="C" soft />
            <GradeBadge grade="A" size={32} />
          </div>
        </div>

        <div className="sec">
          <div className="lbl">Input — default & accent · Divider</div>
          <div className="stack">
            <Input placeholder="Restaurant name" />
            <Input placeholder="Street, borough, or ZIP (optional)" />
            <Divider label="or paste a link" />
            <Input variant="accent" placeholder="Paste a Google Maps link…" />
          </div>
        </div>

        <div className="sec">
          <div className="lbl">Button · StatusLine</div>
          <Button>Look up grade</Button>
          <StatusLine>1 match · official data</StatusLine>
          <StatusLine tone="error">Couldn't find a restaurant name in this link. <a href="#">Open it ↗</a></StatusLine>
        </div>

        <div className="sec">
          <div className="lbl">ResultCard — graded & pending</div>
          <ResultCard
            grade="A" name="Joe's Pizza"
            address="7 Carmine St, Manhattan 10014"
            score={12} gradedDate="Mar 3, 2025"
            inspectedDate="Mar 3, 2025" inspectionType="Cycle Inspection / Re-inspection"
          />
          <ResultCard
            pending name="New Spot Cafe"
            address="55 Bedford Ave, Brooklyn 11211"
            score={9} inspectedDate="May 1, 2025" inspectionType="Pre-permit (Operational)"
          />
        </div>
      </div>
    );
  }
  ReactDOM.createRoot(document.getElementById("root")).render(<Demo />);
</script>
</body>
</html>

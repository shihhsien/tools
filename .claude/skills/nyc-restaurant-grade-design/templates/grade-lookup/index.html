<!-- @template name="Grade Lookup app" description="The full NYC Restaurant Grade screen — labeled search, Maps-link paste, suggestion chips, and A/B/C result cards with score context." -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NYC Restaurant Grade</title>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="./ds-base.js"></script>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; overflow-x: hidden; }
  body { background: var(--surface-page); color: var(--text-primary); font-family: var(--font-sans); }
  input::placeholder { color: var(--text-tertiary); }

  /* suggestion chips */
  .chip {
    appearance: none;
    font-family: var(--font-sans);
    font-size: var(--text-body);
    font-weight: var(--weight-medium);
    color: var(--text-primary);
    background: var(--surface-card);
    border: 1px solid var(--border-default);
    border-radius: var(--radius-pill);
    padding: 11px 16px;
    min-height: var(--tap-target);
    cursor: pointer;
    transition: border-color var(--motion-fast), opacity var(--motion-fast), box-shadow var(--motion-fast);
  }
  .chip:hover { border-color: var(--color-gray); }
  .chip:active { opacity: var(--press-opacity); }
  .chip:focus-visible { outline: none; box-shadow: var(--focus-ring); border-color: var(--focus-border); }

  /* result entrance — transform only, so the first frame is fully visible
     even if the host freezes CSS animation timelines */
  @media (prefers-reduced-motion: no-preference) {
    .enter { animation: rise 220ms cubic-bezier(0.2, 0.7, 0.3, 1); }
    @keyframes rise {
      from { transform: translateY(6px); }
      to { transform: none; }
    }
  }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel" src="Header.jsx"></script>
<script type="text/babel" src="App.jsx"></script>
<script type="text/babel">
  // ds-base.js appends the design-system bundle asynchronously; mount after
  // every resource (including that bundle) has loaded.
  window.addEventListener("load", () => {
    const App = window.GradeLookupApp;
    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  });
</script>
</body>
</html>

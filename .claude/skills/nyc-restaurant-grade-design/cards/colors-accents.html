<!-- @dsCard group="Colors" viewport="700x150" name="Accents & inverse" subtitle="Link blue, error red, Maps-field indigo tint, inverse button" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; background: var(--surface-page); font-family: var(--font-sans); padding: 20px; }
  .row { display: flex; gap: 12px; }
  .sw { flex: 1; }
  .chip { height: 56px; border-radius: var(--radius-md); border: 1px solid var(--border-default); display:flex; align-items:center; justify-content:center; font-size:13px; font-weight:600; }
  .name { color: var(--text-primary); font-size: 12px; font-weight: 600; margin-top: 8px; }
  .hex { color: var(--text-tertiary); font-size: 11px; font-family: var(--font-mono); margin-top: 2px; }
</style>
</head>
<body>
  <div class="row">
    <div class="sw"><div class="chip" style="background:var(--color-card);color:var(--text-link)">link</div><div class="name">link</div><div class="hex">#60a5fa</div></div>
    <div class="sw"><div class="chip" style="background:var(--color-card);color:var(--text-error)">error</div><div class="name">error</div><div class="hex">#f87171</div></div>
    <div class="sw"><div class="chip" style="background:var(--color-accent-bg);border-color:var(--color-accent-line);color:var(--text-secondary)">paste link</div><div class="name">accent field</div><div class="hex">#1a1a2e</div></div>
    <div class="sw"><div class="chip" style="background:var(--surface-inverse);color:var(--text-inverse)">button</div><div class="name">inverse</div><div class="hex">#ffffff</div></div>
  </div>
</body>
</html>

<!-- @dsCard group="Spacing" viewport="700x150" name="Spacing scale" subtitle="Tight 2/4/8/16 mobile rhythm" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; background: var(--surface-page); font-family: var(--font-sans); padding: 22px; }
  .row { display: flex; align-items: flex-end; gap: 18px; }
  .item { text-align: center; }
  .bar { background: var(--color-muted); border-radius: 2px; width: 100%; }
  .tag { color: var(--text-primary); font-size: 11px; font-weight: 600; margin-top: 8px; }
  .px { color: var(--text-tertiary); font-size: 10px; font-family: var(--font-mono); }
</style>
</head>
<body>
  <div class="row">
    <div class="item"><div class="bar" style="height:4px;width:4px"></div><div class="tag">2</div><div class="px">space-1</div></div>
    <div class="item"><div class="bar" style="height:8px;width:8px"></div><div class="tag">4</div><div class="px">space-2</div></div>
    <div class="item"><div class="bar" style="height:8px;width:8px"></div><div class="tag">8</div><div class="px">space-4</div></div>
    <div class="item"><div class="bar" style="height:12px;width:12px"></div><div class="tag">12</div><div class="px">space-6</div></div>
    <div class="item"><div class="bar" style="height:14px;width:14px"></div><div class="tag">14</div><div class="px">space-7</div></div>
    <div class="item"><div class="bar" style="height:16px;width:16px"></div><div class="tag">16</div><div class="px">space-8</div></div>
    <div class="item"><div class="bar" style="height:24px;width:24px"></div><div class="tag">24</div><div class="px">space-10</div></div>
  </div>
</body>
</html>

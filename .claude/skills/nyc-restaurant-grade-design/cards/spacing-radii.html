<!-- @dsCard group="Spacing" viewport="700x160" name="Radii" subtitle="8 debug · 10 chip · 12 input/button · 14 card" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; background: var(--surface-page); font-family: var(--font-sans); padding: 22px; }
  .row { display: flex; gap: 20px; }
  .item { flex: 1; text-align: center; }
  .box { height: 70px; background: var(--surface-card); border: 1px solid var(--border-default); }
  .tag { color: var(--text-primary); font-size: 12px; font-weight: 600; margin-top: 8px; }
  .px { color: var(--text-tertiary); font-size: 10px; font-family: var(--font-mono); }
</style>
</head>
<body>
  <div class="row">
    <div class="item"><div class="box" style="border-radius:var(--radius-sm)"></div><div class="tag">8</div><div class="px">radius-sm · debug</div></div>
    <div class="item"><div class="box" style="border-radius:var(--radius-md)"></div><div class="tag">10</div><div class="px">radius-md · chip</div></div>
    <div class="item"><div class="box" style="border-radius:var(--radius-lg)"></div><div class="tag">12</div><div class="px">radius-lg · input</div></div>
    <div class="item"><div class="box" style="border-radius:var(--radius-xl)"></div><div class="tag">14</div><div class="px">radius-xl · card</div></div>
  </div>
</body>
</html>

<!-- @dsCard group="Colors" viewport="700x150" name="Neutrals" subtitle="Dark surface ramp + three-step text greys" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; background: var(--surface-page); font-family: var(--font-sans); padding: 20px; }
  .row { display: flex; gap: 12px; }
  .sw { flex: 1; }
  .chip { height: 56px; border-radius: var(--radius-md); border: 1px solid var(--border-default); }
  .name { color: var(--text-primary); font-size: 12px; font-weight: 600; margin-top: 8px; }
  .hex { color: var(--text-tertiary); font-size: 11px; font-family: var(--font-mono); margin-top: 2px; }
</style>
</head>
<body>
  <div class="row">
    <div class="sw"><div class="chip" style="background:var(--color-bg)"></div><div class="name">bg</div><div class="hex">#0b0b0c</div></div>
    <div class="sw"><div class="chip" style="background:var(--color-card)"></div><div class="name">card</div><div class="hex">#161617</div></div>
    <div class="sw"><div class="chip" style="background:var(--color-line)"></div><div class="name">line</div><div class="hex">#2a2a2c</div></div>
    <div class="sw"><div class="chip" style="background:var(--color-gray)"></div><div class="name">gray</div><div class="hex">#52525b</div></div>
    <div class="sw"><div class="chip" style="background:var(--color-muted)"></div><div class="name">muted</div><div class="hex">#9b9ba1</div></div>
    <div class="sw"><div class="chip" style="background:var(--color-ink)"></div><div class="name">ink</div><div class="hex">#f4f4f5</div></div>
  </div>
</body>
</html>
